<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>التقديم | Nutrio Meals</title>
<meta name="theme-color" content="#173327">
<meta property="og:title" content="قدّم الآن | Nutrio Meals">
<meta property="og:description" content="قدّم الحين وكمّل عن طريق الواتساب">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --dark:#173327;
  --olive:#6e7a25;--light:#949b50;--cream:#f6f3e9;
  --card:#fffdf6;--line:#e3dfcb;--err:#b3402a;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:"Segoe UI Variable","Cairo","Segoe UI",Tahoma,sans-serif;background:var(--cream);color:var(--dark);line-height:1.6;min-height:100vh;
  background-image:radial-gradient(circle at 100% 0,rgba(148,155,80,.28),transparent 45%),radial-gradient(circle at 0 100%,rgba(110,122,37,.18),transparent 40%);background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 18px max(32px,env(safe-area-inset-bottom))}
header{text-align:center;padding:18px 0 6px}
.logo{width:min(250px,68%);height:auto;display:block;margin:0 auto}
.badge{display:inline-block;margin-top:10px;background:var(--dark);color:var(--cream);font-weight:700;font-size:13px;padding:5px 16px;border-radius:99px;letter-spacing:.3px}
h1{font-size:clamp(26px,7vw,34px);font-weight:800;margin:16px 0 4px;line-height:1.3}
h1 span{color:var(--olive)}
.sub{color:#4b5d50;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:24px 20px;margin-top:22px;box-shadow:0 18px 40px -22px rgba(23,51,39,.45)}
.field{margin-bottom:18px}
label.t,.t{display:block;font-weight:700;font-size:15px;margin-bottom:7px}
.t small{font-weight:400;color:#6b7a6f;margin-inline-start:6px}
input[type=text],input[type=tel],input[type=number],input[type=search]{width:100%;font:inherit;font-size:16px;padding:13px 15px;border:1.6px solid var(--line);border-radius:14px;background:#fff;color:var(--dark);transition:.18s;outline:none}
input:focus{border-color:var(--olive);box-shadow:0 0 0 4px rgba(110,122,37,.18)}
input.bad{border-color:var(--err);box-shadow:0 0 0 4px rgba(179,64,42,.12)}
input[type=tel]{direction:ltr;text-align:right}
.msg{color:var(--err);font-size:13px;margin-top:5px;display:none}
.msg.show{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chip{background:var(--dark);color:var(--cream);font-size:13px;font-weight:600;padding:4px 6px 4px 12px;border-radius:99px;display:inline-flex;align-items:center;gap:6px;animation:pop .18s}
.chip button{all:unset;cursor:pointer;width:20px;height:20px;border-radius:50%;background:rgba(246,243,233,.2);text-align:center;line-height:20px;font-size:14px}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.picker{border:1.6px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}
.picker.bad{border-color:var(--err)}
.search{padding:10px;border-bottom:1px solid var(--line);background:var(--cream);position:sticky;top:0}
.count{font-size:12.5px;color:var(--olive);font-weight:700;margin-top:6px;padding-inline:2px}
.list{max-height:290px;overflow:auto;overscroll-behavior:contain}
.region{position:sticky;top:0;background:var(--dark);color:var(--cream);font-weight:700;font-size:13px;padding:6px 14px;display:flex;justify-content:space-between;z-index:1}
.region em{font-style:normal;color:var(--light)}
.opt{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;border-bottom:1px solid #f0ecda;font-size:15px;user-select:none}
.opt:hover{background:#f7f5e6}
.opt input{appearance:none;width:22px;height:22px;border:2px solid var(--light);border-radius:7px;flex:none;display:grid;place-content:center;transition:.15s;background:#fff}
.opt input::after{content:"";width:11px;height:6px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) scale(0);margin-top:-2px;transition:.15s}
.opt input:checked{background:var(--olive);border-color:var(--olive)}
.opt input:checked::after{transform:rotate(-45deg) scale(1)}
.opt:has(input:checked){background:#f1f2dc;font-weight:700}
.none{padding:22px;text-align:center;color:#6b7a6f;display:none}
.submit{width:100%;margin-top:8px;font:inherit;font-weight:800;font-size:18px;color:var(--cream);background:linear-gradient(135deg,var(--dark),#24493a);border:0;border-radius:16px;padding:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 12px 24px -10px rgba(23,51,39,.7);transition:.2s}
.submit:hover{transform:translateY(-2px)}
.submit:active{transform:scale(.98)}
.submit svg{width:24px;height:24px;fill:#b9c46b}
.note{text-align:center;color:#6b7a6f;font-size:13px;margin-top:12px}
footer{text-align:center;margin-top:26px;font-size:13px;color:#6b7a6f}
</style>
</head>

    <div class="badge">التقديم مفتوح</div>
    <h1>انضم إلى <span>Nutrio Meals</span></h1>
  </header>

  <form class="card" id="f" novalidate autocomplete="on">
    <div class="field">
      <label class="t" for="name">الاسم الكامل</label>
      <input type="text" id="name" name="name" placeholder="اكتب اسمك" autocomplete="name">
      <div class="msg" id="e-name">اكتب اسمك لو سمحت</div>
    </div>

    <div class="field">
      <label class="t" for="phone">رقم الجوال</label>
      <input type="tel" id="phone" name="phone" placeholder="05XXXXXXXX" inputmode="tel" autocomplete="tel">
      <div class="msg" id="e-phone">اكتب رقم جوال صحيح</div>
    </div>

    <div class="field">
      <label class="t" for="age">العمر</label>
      <input type="number" id="age" name="age" placeholder="مثال: 28" inputmode="numeric" min="10" max="90">
      <div class="msg" id="e-age">اكتب عمرك بشكل صحيح</div>
    </div>

    <div class="field">
      <div class="t">الأحياء <small>تقدر تختار أكثر من حي</small></div>
      <div class="picker" id="picker">
        <div class="search">
          <input type="search" id="q" placeholder="ابحث عن الحي..." autocomplete="off">
          <div class="count" id="count">ما اخترت أي حي للحين</div>
        </div>
        <div class="list" id="list"></div>
        <div class="none" id="none">ما فيه حي بهالاسم</div>
      </div>
      <div class="chips" id="chips"></div>
      <div class="msg" id="e-area">اختر حي واحد على الأقل</div>
    </div>

    <button class="submit" type="submit">
      <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.8 14.17c-.25.7-1.43 1.34-1.97 1.39-.5.05-1.13.07-1.82-.11-.42-.13-.96-.31-1.66-.61-2.92-1.26-4.83-4.2-4.98-4.4-.14-.2-1.19-1.58-1.19-3.02s.75-2.14 1.02-2.43c.27-.3.58-.37.78-.37h.56c.18 0 .42-.07.66.5.25.6.84 2.05.91 2.2.07.15.12.32.02.52-.1.2-.15.32-.3.5-.15.17-.31.38-.45.51-.15.15-.3.31-.13.6.17.3.77 1.27 1.65 2.05 1.13 1 2.09 1.31 2.39 1.46.3.15.47.12.65-.07.17-.2.75-.87.95-1.17.2-.3.4-.25.67-.15.27.1 1.72.81 2.02.96.3.15.5.22.57.35.07.12.07.72-.18 1.42z"/></svg>
      إرسال التقديم عبر واتساب
    </button>
    <p class="note">بيفتح لك الواتساب والرسالة جاهزة، بس اضغط إرسال</p>
  </form>
  <footer>© Nutrio Meals</footer>
</div>

<script>
const WA = "966553505646";
const REGIONS = {
  "شمال الرياض":["الياسمين","النرجس","الملقا","الصحافة","حطين","العقيق","الربيع","الغدير","النفل","القيروان","الوادي","الفلاح","الندى","النخيل","المحمدية","الرحمانية","الورود","المصيف","التعاون"],
  "شرق الرياض":["الروضة","النسيم الشرقي","النسيم الغربي","الرمال","اليرموك","قرطبة","الخليج","المونسية","اشبيلية","الجنادرية","الحمراء","القدس","النهضة","السعادة","الريان","الأندلس","غرناطة","المعيزيلة"],
  "غرب الرياض":["السويدي","العريجاء","ظهرة لبن","طويق","المهدية","نمار","شبرا","البديعة","سلطانة","لبن","ديراب","العوالي"],
  "جنوب الرياض":["الشفا","العزيزية","الدار البيضاء","بدر","المنصورة","الحزم","المصانع","عكاظ","الدريهمية","غبيراء","الخالدية","المنار","الصناعية","أحد","الإسكان"],
  "وسط الرياض":["العليا","السليمانية","الملز","المربع","الوزارات","الفوطة","الديرة","المرسلات","الملك فهد","الملك عبدالعزيز","الضباط","جرير","الصفا","العمل"]
};
const $=id=>document.getElementById(id);
const selected=new Set();
const norm=s=>s.replace(/[\u064B-\u065F\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").trim().toLowerCase();
const toEn=s=>s.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));

const list=$("list");
function render(){
  const q=norm($("q").value);
  list.innerHTML="";let shown=0;
  for(const [r,items] of Object.entries(REGIONS)){
    const m=items.filter(n=>!q||norm(n).includes(q)||norm(r).includes(q));
    if(!m.length)continue;shown+=m.length;
    const h=document.createElement("div");h.className="region";
    const c=items.filter(n=>selected.has(n)).length;
    h.innerHTML=`<span>${r}</span><em>${c?c+" مختار":""}</em>`;list.appendChild(h);
    m.forEach(n=>{
      const l=document.createElement("label");l.className="opt";
      const i=document.createElement("input");i.type="checkbox";i.checked=selected.has(n);i.value=n;
      i.onchange=()=>{i.checked?selected.add(n):selected.delete(n);update(true)};
      l.append(i,document.createTextNode(n));list.appendChild(l);
    });
  }
  $("none").style.display=shown?"none":"block";
  list.style.display=shown?"block":"none";
}
function update(keepScroll){
  const y=list.scrollTop;
  $("count").textContent=selected.size?`اخترت ${selected.size} ${selected.size===1?"حي":"أحياء"}`:"ما اخترت أي حي للحين";
  const ch=$("chips");ch.innerHTML="";
  selected.forEach(n=>{
    const s=document.createElement("span");s.className="chip";s.textContent=n;
    const b=document.createElement("button");b.type="button";b.textContent="×";b.setAttribute("aria-label","إزالة "+n);
    b.onclick=()=>{selected.delete(n);update(true)};
    s.appendChild(b);ch.appendChild(s);
  });
  if(selected.size){$("picker").classList.remove("bad");$("e-area").classList.remove("show")}
  render();if(keepScroll)list.scrollTop=y;
}
$("q").addEventListener("input",()=>{render()});

function bad(id,eid,on){$(id).classList.toggle("bad",on);$(eid).classList.toggle("show",on);return !on}
$("f").addEventListener("submit",e=>{
  e.preventDefault();
  const name=$("name").value.trim();
  const phone=toEn($("phone").value).replace(/[^\d+]/g,"");
  const age=parseInt(toEn($("age").value),10);
  let ok=true;
  ok=bad("name","e-name",name.length<2)&&ok;
  ok=bad("phone","e-phone",phone.replace(/\D/g,"").length<9)&&ok;
  ok=bad("age","e-age",!(age>=10&&age<=90))&&ok;
  const noArea=selected.size===0;
  $("picker").classList.toggle("bad",noArea);$("e-area").classList.toggle("show",noArea);
  if(noArea)ok=false;
  if(!ok){const f=document.querySelector(".bad,.msg.show");f&&f.scrollIntoView({block:"center",behavior:"smooth"});return}
  const text=["طلب تقديم جديد - Nutrio Meals","",
    "الاسم: "+name,"رقم الجوال: "+phone,"العمر: "+age,
    "الأحياء: "+[...selected].join("، ")].join("\n");
  window.location.href="https://wa.me/"+WA+"?text="+encodeURIComponent(text);
});
["name","phone","age"].forEach(id=>$(id).addEventListener("input",()=>{$(id).classList.remove("bad");$("e-"+id).classList.remove("show")}));
update();
</script>
</body>
